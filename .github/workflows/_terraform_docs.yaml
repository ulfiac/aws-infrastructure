name: _terraform-docs
run-name: "terraform-docs: ${{ github.ref_name }}"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/modules/**'
      - '!terraform/modules/**/README.md'
  workflow_dispatch: {}

permissions: {}

jobs:
  terraform-docs:
    uses: ulfiac/commons/.github/workflows/reusable_terraform_docs.yaml@79be0e63251c74375634c2b5dff4ad403944ed78 # v1.0.39
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
