name: _terraform-docs-PR
run-name: "terraform-docs PR: ${{ github.event.pull_request.title }}"

on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/modules/**'
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  terraform-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, released 2026-01, checked 2026-03
        with:
          ref: ${{ github.head_ref }}

      - id: read-template
        run: |
          {
            echo 'content<<TEMPLATE_EOF'
            cat .github/terraform-docs-template.md
            echo 'TEMPLATE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1, released 2025-05, checked 2026-03
        with:
          args: --anchor=false
          find-dir: terraform/modules
          git-push: true
          template: ${{ steps.read-template.outputs.content }}
