name: reusable tg action
run-name: "${{ inputs.terragrunt_action }}: ${{ inputs.working_dir }}"

on:
  workflow_call:
    inputs:
      aws_region:
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      github_environment:
        required: true
        type: string
      terragrunt_action:
        required: true
        type: string
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_queue_include_dir:
        default: "./**"
        required: false
        type: string
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean
      working_dir:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      aws_region:
        default: us-east-2
        required: true
        type: string
      dump_github_context:
        default: false
        required: false
        type: boolean
      github_environment:
        default: aws_mgmt
        options:
          - aws_green
          - aws_purple
          - aws_mgmt
        required: true
        type: choice
      terragrunt_action:
        default: plan
        options:
          - plan
          - plan destroy
          - apply
          - destroy
        required: true
        type: choice
      terragrunt_parallelism:
        default: true
        required: false
        type: boolean
      terragrunt_queue_include_dir:
        default: "./**"
        required: false
        type: string
      terragrunt_strict_mode:
        default: true
        required: false
        type: boolean
      working_dir:
        required: true
        type: string

env:
  TF_LOG: OFF
  TF_LOG_CORE: OFF
  TF_LOG_PROVIDER: OFF
  TF_LOG_PATH: ./terraform.log

permissions:
  contents: read
  id-token: write

jobs:
  reusable-terragrunt-action:
    name: "${{ inputs.terragrunt_action }}  ${{ inputs.working_dir }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terragrunt/${{ inputs.working_dir }}
    environment: ${{ inputs.github_environment }}
    env:
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}
      TG_ALL: "true"
      TG_NON_INTERACTIVE: "true"
      TG_PARALLELISM: ${{ inputs.terragrunt_parallelism == true && 10 || 1 }}
      TG_QUEUE_INCLUDE_DIR: ${{ inputs.terragrunt_queue_include_dir }}
      TG_STRICT_MODE: ${{ inputs.terragrunt_strict_mode }}
      TG_SUMMARY_PER_UNIT: "true"
      TG_VAR_AWS_ACCOUNT_EMAIL: ${{ secrets.AWS_ACCOUNT_EMAIL }}
      TG_VAR_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      TG_VAR_EMAIL_DOMAIN: ${{ secrets.EMAIL_DOMAIN }}
      TG_VAR_EMAIL_PREFIX: ${{ secrets.EMAIL_PREFIX }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2, released 2026-01, checked 2026-03
      - run: pwd

      - run: shasum --version
      - run: gpg --version

      # - name: add gpg public key
      #   env:
      #     GPG_PUBLIC_KEY_BINARY_BASE64: ${{ vars.GPG_PUBLIC_KEY_BINARY_BASE64 }}
      #   run: ${{ github.workspace }}/scripts/add_gpg_public_key.sh

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0, released 2026-02, checked 2026-03
        with:
          terraform_wrapper: false
      - run: terraform --version

      - uses: gruntwork-io/terragrunt-action@53dbdc2c3d43e82bf3bae10b734a968196442bec # v3.2.0, released 2026-03, checked 2026-03
        with:
          tf_path: .
          tg_version: "latest"
      - run: terragrunt --version

      - run: aws --version

      - name: configure aws credentials with oidc
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0, released 2026-02, checked 2026-03
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.OIDC_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws_region == '_global' && 'us-east-2' || inputs.aws_region }}

      - name: dump input context (script)
        env:
          CONTEXT_INPUTS: ${{ toJson(inputs) }}
        run: ${{ github.workspace }}/scripts/dump_input_context.sh

      - name: dump all contexts (script)
        if: ${{ inputs.dump_github_context }}
        env:
          CONTEXT_ENV: ${{ toJson(env) }}
          CONTEXT_GITHUB: ${{ toJson(github) }}
          CONTEXT_INPUTS: ${{ toJson(inputs) }}
          CONTEXT_JOB: ${{ toJson(job) }}
          CONTEXT_MATRIX: ${{ toJson(matrix) }}
          CONTEXT_NEEDS: ${{ toJson(needs) }}
          CONTEXT_RUNNER: ${{ toJson(runner) }}
          CONTEXT_STEPS: ${{ toJson(steps) }}
          CONTEXT_STRATEGY: ${{ toJson(strategy) }}
          CONTEXT_VARS: ${{ toJson(vars) }}
        run: ${{ github.workspace }}/scripts/dump_all_contexts.sh

      - name: terragrunt plan
        if: ${{ inputs.terragrunt_action == 'plan' }}
        run: |
          terragrunt plan -out=tfplan.binary

      - name: terragrunt plan destroy
        if: ${{ inputs.terragrunt_action == 'plan destroy' }}
        run: |
          terragrunt plan -destroy -out=tfplan.binary

      - name: show plan summary
        if: ${{ inputs.terragrunt_action == 'plan' || inputs.terragrunt_action == 'plan destroy' }}
        run: |
          ${{ github.workspace }}/scripts/show_tg_plan_summary.sh "${{ inputs.terragrunt_action }}"

      - name: terragrunt apply
        if: ${{ inputs.terragrunt_action == 'apply' }}
        run: |
          set -o pipefail
          terragrunt apply -auto-approve 2>&1 | tee tfapply.out

      - name: terragrunt destroy
        if: ${{ inputs.terragrunt_action == 'destroy' }}
        run: |
          set -o pipefail
          terragrunt apply -destroy -auto-approve 2>&1 | tee tfdestroy.out

      - name: show apply summary
        if: ${{ inputs.terragrunt_action == 'apply' || inputs.terragrunt_action == 'destroy' }}
        run: |
          ${{ github.workspace }}/scripts/show_tg_apply_summary.sh "${{ inputs.terragrunt_action }}"
